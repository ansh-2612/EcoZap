services:
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ecozap-mongo:/data/db
      - ./app/src/main/assets/delhi_stations.json:/demo/stations.json:ro
      - ./backend/dev/seed.js:/docker-entrypoint-initdb.d/10-ecozap.js:ro
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  ecozap-mongo:
